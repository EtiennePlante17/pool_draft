name: Publier les rapports Quarto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # Récupérer le repository
      - name: Checkout
        uses: actions/checkout@v6

      # Installer R
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      # Installer les packages R
      - name: Installer les packages R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::dplyr
            any::purrr
            any::ggplot2
            any::tidyr
            any::plotly
            any::scales
            any::here
            any::gt
          dependencies: '"all"'

      # Installer Quarto
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Générer le rapport
     - name: Render du rapport
        run: |
          quarto render 2026/suivi_2026.qmd
          mkdir -p _site/2026
          cp 2026/suivi_2026.html _site/2026/

      # Configurer GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Préparer les fichiers à publier
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4